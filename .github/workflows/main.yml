name: Rakib-BoT

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: rakib-bot
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start UCA_BOT
        run: npm start
